name: build-mesa-ps4

# Builds Mesa (latest stable) + the PS4 "Liverpool" patch into a host-installable
# pacman package (mesa-ps4), inside an Arch Linux container (matching host LLVM).
# Caches: the upstream source tarball (downloads) and ccache (compiled objects),
# both saved even when the build fails so re-runs are much faster.

on:
  workflow_dispatch:
    inputs:
      mesa_version:
        description: "Mesa version to build (latest stable, e.g. 26.2.4)"
        required: true
        default: "26.2.4"

jobs:
  build:
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 240

    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel git meson ninja ccache \
            python-mako python-ply python-packaging python-pyaml \
            glslang directx-headers wayland-protocols libxml2 libxrandr \
            elfutils xorgproto libva llvm clang libclc \
            spirv-llvm-translator spirv-tools

      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore source tarball cache
        id: cache-src
        uses: actions/cache/restore@v4
        with:
          path: srcdest
          key: srcdest-mesa-${{ github.event.inputs.mesa_version }}

      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-mesa-${{ github.event.inputs.mesa_version }}-${{ github.run_id }}
          restore-keys: |
            ccache-mesa-${{ github.event.inputs.mesa_version }}-
            ccache-mesa-

      - name: Prepare build user, source cache and ccache
        run: |
          set -euo pipefail
          V="${{ github.event.inputs.mesa_version }}"
          useradd -m build
          mkdir -p srcdest .ccache
          if [ ! -s "srcdest/mesa-$V.tar.gz" ]; then
            echo "downloading Mesa $V tarball..."
            curl -sSL --retry 3 -o "srcdest/mesa-$V.tar.gz" \
              "https://gitlab.freedesktop.org/mesa/mesa/-/archive/mesa-$V/mesa-mesa-$V.tar.gz"
          else
            echo "source tarball from cache"
          fi
          cp -f "srcdest/mesa-$V.tar.gz" "mesa-ps4/mesa-$V.tar.gz"
          chown -R build:build "$GITHUB_WORKSPACE"

      - name: Build mesa-ps4 (with PS4 patch)
        working-directory: mesa-ps4
        run: |
          set -euo pipefail
          sed -i "s/^pkgver=.*/pkgver=${{ github.event.inputs.mesa_version }}/" PKGBUILD
          grep -E '^pkgver=' PKGBUILD
          su build -c "CCACHE_DIR=$PWD/../.ccache CCACHE_COMPILERCHECK=content CCACHE_BASEDIR=$PWD \
              CC='ccache gcc' CXX='ccache g++' \
              makepkg --noconfirm --nodeps"
          ls -lh *.pkg.tar.zst

      - name: ccache stats
        if: always()
        run: CCACHE_DIR="$GITHUB_WORKSPACE/.ccache" ccache -s 2>&1 | head -30 || true

      - name: Save ccache (even on failure)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ccache-mesa-${{ github.event.inputs.mesa_version }}-${{ github.run_id }}

      - name: Save source tarball cache
        if: always() && steps.cache-src.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: srcdest
          key: srcdest-mesa-${{ github.event.inputs.mesa_version }}

      - name: Upload package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mesa-ps4-${{ github.event.inputs.mesa_version }}
          path: mesa-ps4/*.pkg.tar.zst
          if-no-files-found: error
